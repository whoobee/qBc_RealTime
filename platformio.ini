; PlatformIO Project Configuration File — qB Companion Teensy 4.1 Firmware
;
; Hardware: Teensy 4.1 (600MHz ARM Cortex-M7 / iMXRT1062)
; Framework: Arduino + HeliOS (cooperative multitasking)
; Build order: Layer 1 (drivers) → 2 (fusion) → 3 (monitor) → 4 (safety) → 5 (comm)

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

monitor_speed = 115200

; HeliOS lives in lib/HeliOS (local, modified for Teensy) — no lib_deps entry needed.
lib_deps =
    ; COBS-framed serial packets for Teensy ↔ Pi link
    bakercp/PacketSerial
    ; TOF distance sensors (3x VL53L0X on I2C)
    adafruit/Adafruit_VL53L0X
    ; IMU (BNO055 — fused quaternion + Euler on-chip)
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    ; YDLidar GS2 — 360° scanning laser
    https://github.com/Hyperion-Robotics/YDLiDaR_GS2.git

build_flags =
    -std=gnu++17
    -DCORE_TEENSY
    ; Increase Serial RX/TX buffer sizes to match actual wiring
    -DSERIAL1_RX_BUFFER_SIZE=512   ; Pi comm (PacketSerial)
    -DSERIAL1_TX_BUFFER_SIZE=512
    -DSERIAL2_RX_BUFFER_SIZE=256   ; ST3215 servo bus
    -DSERIAL3_RX_BUFFER_SIZE=256   ; DDSM210 Motor R
    -DSERIAL5_RX_BUFFER_SIZE=256   ; DDSM210 Motor L
    -DSERIAL6_RX_BUFFER_SIZE=512   ; YDLidar GS2 @ 921600 baud
